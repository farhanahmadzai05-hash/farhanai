<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <title>Farhan AI</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/vendor/katex.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="splash" class="splash" role="button" tabindex="0" aria-label="Enter Farhan AI">
    <div class="splash-grid" aria-hidden="true"></div>
    <div class="splash-center">
      <svg class="splash-title" id="splash-title" aria-hidden="true"></svg>
      <p class="splash-tagline">Beyond today</p>
    </div>
    <p class="splash-hint" id="splash-hint">Press any key to continue</p>
  </div>
  <script src="/splash.js"></script>
  <div class="glow" aria-hidden="true"></div>
  <div class="scene" aria-hidden="true"><div class="floor"></div></div>

  <header>
    <div class="brand">
      <img src="/icon.svg" alt="" class="logo">
      <div>
        <h1 id="app-name">Farhan AI</h1>
        <div class="online"><span class="dot"></span><span id="model">online</span></div>
      </div>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode">
      <span class="modes-pill" id="modes-pill" aria-hidden="true"></span>
      <button type="button" role="tab" class="mode" data-panel="0" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span>Chat</span>
      </button>
      <button type="button" role="tab" class="mode" data-panel="1" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span>Voice</span>
      </button>
    </nav>
    <div class="actions">
    <button id="music" class="ghost icon-only" type="button" title="Play background music" aria-label="Background music" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M3 3l18 18"/></svg>
    </button>
    <button id="new-chat" class="ghost" type="button" title="Start a new chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>
    </div>
  </header>

  <div class="panels" id="panels">
    <section class="panel" id="chat-panel" aria-label="Chat">
      <div class="card">
        <div id="banner" class="banner" hidden></div>

        <main id="messages" aria-live="polite">
          <section class="intro" id="intro">
            <div class="hero"><img src="/icon.svg" alt="" class="big-logo"></div>
            <div class="row assistant">
              <img src="/icon.svg" alt="" class="avatar">
              <div class="bubble" id="welcome"></div>
            </div>
            <div class="creator-note" id="creator-note" hidden>
              <div class="creator-label">A message from the creator</div>
              <div id="creator-message"></div>
            </div>
            <div class="chips" id="chips">
              <button type="button" class="chip">Tell me a fun fact</button>
              <button type="button" class="chip">Help me write a message</button>
              <button type="button" class="chip">Explain something simply</button>
              <button type="button" class="chip">Give me a workout plan</button>
            </div>
          </section>
        </main>

        <form id="composer">
          <div class="bar">
            <textarea id="input" rows="1" placeholder="Message Farhan AI…" autofocus></textarea>
            <button id="send" type="submit" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <p class="hint">Enter to send · Shift+Enter for a new line · Swipe or tap Voice to talk</p>
        </form>
      </div>
    </section>

    <section class="panel" id="voice-panel" aria-label="Voice">
      <div class="card voice" id="voice" data-state="idle">
        <p class="voice-label">Voice mode</p>
        <button type="button" class="orb" id="orb" aria-label="Start talking">
          <span class="orb-glow"></span>
          <span class="orb-ring r1"></span>
          <span class="orb-ring r2"></span>
          <span class="orb-ring r3"></span>
          <span class="orb-core"></span>
          <span class="orb-shine"></span>
          <svg class="orb-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <p class="voice-status" id="voice-status">Tap the orb and start talking</p>
        <p class="voice-heard" id="voice-heard"></p>
        <div class="voice-reply" id="voice-reply"></div>
        <p class="voice-hint">Your voice chats also appear in Chat. Swipe back any time.</p>
      </div>
    </section>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/katex.min.js"></script>
  <script src="/app.js"></script>
  <script src="/music.js"></script>
  <script src="/panels.js"></script>
  <script src="/voice.js"></script>
</body>
</html>
